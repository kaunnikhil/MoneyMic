    <meta name="description" content="MoneyMic Autonomous Financial Agent Simulator: L3 bounded autonomy financial agent powered by Gemini 3.8 Flash Interactions API." />

    <script>
      // Suppress noisy third-party wallet browser extension errors (e.g. MetaMask injection)
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('MetaMask') || event.message.includes('ethereum'))) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason) : '';
        if (reason.includes('MetaMask') || reason.includes('ethereum')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
